name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r application/webapp/phase1-local/requirements.txt

      - name: Verify app
        run: |
          cd application/webapp/phase1-local
          python -c "from app import app; print('Import OK')"

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todo-app:${{ github.sha }} .

      - name: Verify image
        run: docker images todo-app
